<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酸奶子</title>
    <!-- 引入外部资源（与上一页相同） -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <!-- Tailwind配置（与上一页相同） -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#6366F1',
                        dark: 'rgba(0, 0, 0, 0.7)',
                        light: 'rgba(255, 255, 255, 0.9)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .bg-blur { backdrop-filter: blur(8px); }
            .text-shadow { text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3); }
            .image-hover {
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .image-hover:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            }
        }
    </style>

    <style>
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-image: url('assets/img/travel2.jpg');
            filter: brightness(0.6);
        }

        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .image-container img {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body class="font-sans text-light min-h-screen">
    <div class="fixed inset-0 bg-dark z-[-1]"></div>
    <div class="background-container"></div>

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="mb-6 fade-in">
            <a href="habbyabout.html#travel-view"
                class="inline-flex items-center gap-2 text-light/80 hover:text-light transition-colors">
                <i class="fa fa-arrow-left"></i>
                <span>返回旅行主页</span>
            </a>
        </div>

        <main class="fade-in">
            <div class="bg-dark/60 bg-blur rounded-xl p-6 md:p-8 shadow-2xl">
                <h2 class="text-3xl md:text-4xl font-bold mb-6 text-shadow">新疆旅行</h2>

                <!-- 图片展示区 -->
                <div class="grid grid-cols-1 gap-6 mb-8">
                    <div class="image-container rounded-lg overflow-hidden shadow-lg image-hover h-100">
                        <img src="assets/img/travel/酸奶子1.jpg" alt="城市天际线">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div class="image-container rounded-lg overflow-hidden shadow-lg image-hover h-64">
                            <img src="assets/img/travel/酸奶子2.jpg" alt="城市街景">
                        </div>
                        <div class="image-container rounded-lg overflow-hidden shadow-lg image-hover h-64">
                            <img src="assets/img/travel/新疆.jpg" alt="城市夜景">
                        </div>
                    </div>
                </div>

                <!-- 文字内容区 -->
                <div class="prose prose-lg prose-invert max-w-none">
                    <p>草原的广阔，让野马再也回不了逼仄</p>
                    <br>

                    <p class="mt-4">
                        我仍然记得远山对我的吸引，爬过木头栈桥，穿过湿润的森林，走过湍流上的吊桥，越过草原，才堪堪到山脚下。
                    </p>
                    <br>

                    <p class="mt-4">路上，一旁豢养着群马的人家，遇到几个小孩。我问小孩，上山的路怎么走啊，他操着生疏的口音，用奇怪的断句一点点吐出自己的话语，你喝酸奶子不？</p>
                    <br>
                    <p class="mt-4">再向上走，小心翼翼从牛群中走过，两个人骑着马缓缓的从后方骑过来，告诉我前面没有人走的路了。望着一旁围起的花田，和远处的马林，我又开始下山。</p>
                    <br>
                </div>
            </div>
        </main>

        <footer class="mt-12 text-center text-light/60 text-sm fade-in">
            <p>旅行记忆 &copy; 2023</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.fade-in').forEach((el, index) => {
                setTimeout(() => {
                    el.style.opacity = '1';
                }, 100 * index);
            });
        });
    </script>
</body>

</html>
